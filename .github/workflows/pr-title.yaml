# release-please builds versions and release notes from conventional commit
# messages, and PRs are squash-merged, so the PR title must follow the format.
name: pr-title
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  pull-requests: read
jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
    - uses: amannn/action-semantic-pull-request@v6.1.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
