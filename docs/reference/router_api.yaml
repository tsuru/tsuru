#
# Tsuru Router API Specification
#
openapi: 3.0.0

info:
  title: Tsuru Router API
  description: |
    Tsuru Router API integration to external routers.

    Any response with status >= 300 is treated as an error by tsuru, and the
    response body is used as the error message. When the router is configured
    with `headers`, they are sent on every request. When `multi-cluster` is
    enabled, the pool's cluster headers are sent on every backend request.
  version: "2.0.0"

paths:
  /backend/{name}:
    get:
      summary: Application backend addresses
      description: |
        Returns the addresses where the application is published.
      parameters:
      - $ref: '#/components/parameters/Name'
      tags:
      - Backends
      responses:
        "200":
          description: Backend addresses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        "404":
          description: Backend not found
        default:
          $ref: '#/components/responses/Error'

    put:
      summary: Ensure application backend
      description: |
        Creates the backend or updates it to match the desired state. The
        request must be idempotent. The `Content-Type` sent by tsuru is
        `application/json; router=v2`.
      parameters:
      - $ref: '#/components/parameters/Name'
      requestBody:
        required: true
        content:
          application/json; router=v2:
            schema:
              $ref: '#/components/schemas/EnsureBackendOpts'
      tags:
      - Backends
      responses:
        "200":
          description: Backend ensured
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Delete application backend
      parameters:
      - $ref: '#/components/parameters/Name'
      tags:
      - Backends
      responses:
        "200":
          description: Backend removed
        "400":
          description: Backend was swapped to other (body contains "backend swapped")
        "404":
          description: Backend not found
        default:
          $ref: '#/components/responses/Error'

  /backend/{name}/status:
    get:
      summary: Application backend status
      parameters:
      - $ref: '#/components/parameters/Name'
      tags:
      - Backends
      responses:
        "200":
          description: Backend status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/Error'

  /backend/{name}/certificate/{cname}:
    get:
      summary: Get HTTPS certificate
      description: Only called when the router supports `tls`.
      parameters:
      - $ref: '#/components/parameters/Name'
      - $ref: '#/components/parameters/Cname'
      tags:
      - Certificate
      responses:
        "200":
          description: Certificate object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'
        "404":
          description: Certificate not found
        default:
          $ref: '#/components/responses/Error'

    put:
      summary: Add or update HTTPS certificate
      description: Only called when the router supports `tls`.
      parameters:
      - $ref: '#/components/parameters/Name'
      - $ref: '#/components/parameters/Cname'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Certificate'
      tags:
      - Certificate
      responses:
        "200":
          description: Certificate stored
        default:
          $ref: '#/components/responses/Error'

    delete:
      summary: Remove HTTPS certificate
      description: Only called when the router supports `tls`.
      parameters:
      - $ref: '#/components/parameters/Name'
      - $ref: '#/components/parameters/Cname'
      tags:
      - Certificate
      responses:
        "200":
          description: Certificate removed
        "404":
          description: Certificate not found
        default:
          $ref: '#/components/responses/Error'

  /support/{feature}:
    get:
      summary: Check feature support
      description: |
        Capability probe, called when the router is created. Currently the only
        feature probed is `tls`. A `200` enables the feature and a `404`
        disables it. Any other status is logged and treated as unsupported.
      parameters:
      - name: feature
        in: path
        description: Feature name.
        required: true
        schema:
          type: string
          enum:
          - tls
      tags:
      - Support
      responses:
        "200":
          description: Feature is supported
        "404":
          description: Feature is not supported
        default:
          $ref: '#/components/responses/Error'

  /info:
    get:
      summary: Router information
      description: Returns free-form key/value information about the router.
      tags:
      - Info
      responses:
        "200":
          description: Router information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
        default:
          $ref: '#/components/responses/Error'

# Object definitions
components:
  parameters:
    Name:
      name: name
      in: path
      description: Application (backend) name.
      required: true
      schema:
        type: string
    Cname:
      name: cname
      in: path
      description: CNAME the certificate belongs to.
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Unexpected error. The response body is used as the error message.
      content:
        text/plain:
          schema:
            type: string

  schemas:
    EnsureBackendOpts:
      type: object
      properties:
        opts:
          type: object
          description: |
            Router options set on the app, plus the keys `tsuru.io/app-pool`,
            `tsuru.io/app-teamowner` and `tsuru.io/app-teams`, which tsuru
            always adds.
          additionalProperties: true
        cnames:
          type: array
          items:
            type: string
        team:
          type: string
        tags:
          type: array
          items:
            type: string
        certIssuers:
          type: object
          description: Certificate issuer by cname.
          additionalProperties:
            type: string
        prefixes:
          type: array
          items:
            $ref: '#/components/schemas/BackendPrefix'
        healthcheck:
          $ref: '#/components/schemas/Healthcheck'
    BackendPrefix:
      type: object
      properties:
        prefix:
          type: string
          description: Address prefix, empty for the default target.
        target:
          type: object
          description: Where to route, in kubernetes like `{serviceName, namespace}`.
          additionalProperties:
            type: string
    Healthcheck:
      type: object
      properties:
        Path:
          type: string
        TCPOnly:
          type: boolean
    Backend:
      type: object
      properties:
        address:
          type: string
          description: Main address where the application is published.
        addresses:
          type: array
          description: All addresses where the application is published.
          items:
            type: string
    Status:
      type: object
      properties:
        status:
          type: string
          enum:
          - ready
          - not ready
        detail:
          type: string
    Certificate:
      type: object
      properties:
        certificate:
          type: string
          description: PEM encoded certificate
        key:
          type: string
          description: PEM encoded key
    Info:
      type: object
      additionalProperties:
        type: string
