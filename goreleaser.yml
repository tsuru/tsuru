# goreleaser.yml
# Build customization
builds:
- main: ./cmd/tsurud
  binary: tsurud
  flags: [-trimpath]
  ldflags: -s -w -X github.com/tsuru/tsuru/api.GitHash={{.Commit}} -X github.com/tsuru/tsuru/api.Version={{ .Version }}
  env: [CGO_ENABLED=0]
  goos: [linux]
  goarch:
  - amd64
# Release customization
release:
  # release-please creates the tag with a draft release; publish that one
  # instead of creating a second release for the same tag.
  use_existing_draft: true
changelog:
  disable: true
# Archive customization
archives:
- name_template: tsuru-server_{{.Version}}_{{.Os}}_{{.Arch}}
  formats:
  - tar.gz
  files: [etc/tsuru.conf]
